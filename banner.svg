<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050506"/>
      <stop offset="45%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#0d0304"/>
    </linearGradient>

    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ff1a1a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff1a1a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff1a1a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="50%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#7a0000"/>
    </linearGradient>

    <filter id="neonRed" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2"/>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff1a1a" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="1200" height="380" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="380" fill="url(#bgGrad)"/>
    <rect width="1200" height="380" fill="url(#gridPattern)"/>

    <!-- corner frame ticks -->
    <g stroke="#ff1a1a" stroke-width="1.5" opacity="0.7">
      <path d="M20,20 L60,20 M20,20 L20,60"/>
      <path d="M1180,20 L1140,20 M1180,20 L1180,60"/>
      <path d="M20,360 L60,360 M20,360 L20,320"/>
      <path d="M1180,360 L1140,360 M1180,360 L1180,320"/>
    </g>

    <!-- top status bar -->
    <text x="40" y="38" font-family="Courier New, monospace" font-size="12" fill="#ff3b3b" opacity="0.85" letter-spacing="2">
      SYS://BRITANNIA_NET &#8226; SECURE_CHANNEL &#8226; STATUS: ACTIVE
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="1160" y="38" font-family="Courier New, monospace" font-size="12" fill="#ff3b3b" opacity="0.7" text-anchor="end" letter-spacing="2">
      ID: 07-777-ZR
    </text>

    <!-- RADAR SYSTEM (left) -->
    <g transform="translate(150,205)">
      <circle r="95" fill="url(#radarGlow)"/>
      <circle r="90" fill="none" stroke="#ff1a1a" stroke-opacity="0.35" stroke-width="1"/>
      <circle r="65" fill="none" stroke="#ff1a1a" stroke-opacity="0.28" stroke-width="1"/>
      <circle r="40" fill="none" stroke="#ff1a1a" stroke-opacity="0.22" stroke-width="1"/>
      <circle r="15" fill="none" stroke="#ff1a1a" stroke-opacity="0.4" stroke-width="1"/>
      <line x1="-95" y1="0" x2="95" y2="0" stroke="#ff1a1a" stroke-opacity="0.18"/>
      <line x1="0" y1="-95" x2="0" y2="95" stroke="#ff1a1a" stroke-opacity="0.18"/>

      <g>
        <path d="M0,0 L95,0 A95,95 0 0,1 67,67 Z" fill="url(#sweepGrad)" opacity="0.55"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      </g>

      <circle cx="34" cy="-52" r="2.6" fill="#ff2b2b" filter="url(#neonRed)">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-58" cy="20" r="2.2" fill="#ff2b2b" filter="url(#neonRed)">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="10" cy="70" r="2.2" fill="#ff2b2b" filter="url(#neonRed)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/>
      </circle>

      <circle r="96" fill="none" stroke="#ff1a1a" stroke-width="1.4" opacity="0.55"/>
      <text x="0" y="122" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#ff3b3b" opacity="0.75" letter-spacing="3">TRACKING</text>
    </g>

    <!-- CENTER TITLE BLOCK -->
    <g transform="translate(430,120)">
      <text x="0" y="0" font-family="Arial Black, Arial, sans-serif" font-size="18" fill="#ff3b3b" opacity="0.85" letter-spacing="10">
        // COMMAND INTERFACE
      </text>

      <text x="0" y="72" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="url(#titleGrad)" filter="url(#neonRed)" letter-spacing="4">
        ZERO PROTOCOL
        <animate attributeName="opacity" values="1;0.85;1" dur="3.4s" repeatCount="indefinite"/>
      </text>

      <rect x="0" y="90" width="620" height="2" fill="#ff1a1a" opacity="0.6"/>

      <text x="0" y="128" font-family="Courier New, monospace" font-size="24" fill="#f2f2f2" letter-spacing="6">
        JOHAN
      </text>
      <text x="145" y="128" font-family="Courier New, monospace" font-size="24" fill="#ff3b3b" letter-spacing="2" opacity="0.9">
        &#8226; PYTHON BACKEND DEVELOPER
      </text>

      <text x="0" y="160" font-family="Courier New, monospace" font-size="13" fill="#8a8a8a" letter-spacing="1">
        "The world cannot be changed with pretty words alone."
      </text>
    </g>

    <!-- scan line -->
    <rect x="0" y="0" width="1200" height="3" fill="#ff1a1a" opacity="0.5" filter="url(#softGlow)">
      <animate attributeName="y" values="0;380;0" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- bottom terminal strip -->
    <rect x="0" y="340" width="1200" height="40" fill="#0a0a0a" opacity="0.85"/>
    <rect x="0" y="340" width="1200" height="1" fill="#ff1a1a" opacity="0.4"/>
    <text x="40" y="365" font-family="Courier New, monospace" font-size="12" fill="#ff3b3b" opacity="0.85">
      &gt; initializing_geass_command_protocol
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </text>
    <text x="1160" y="365" text-anchor="end" font-family="Courier New, monospace" font-size="12" fill="#666">
      REC &#9679;
    </text>
    <circle cx="1030" cy="361" r="4" fill="#ff1a1a">
      <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- flicker overlay -->
    <rect width="1200" height="380" fill="#ff1a1a" opacity="0">
      <animate attributeName="opacity" values="0;0;0.02;0;0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="378" rx="10" fill="none" stroke="#ff1a1a" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
