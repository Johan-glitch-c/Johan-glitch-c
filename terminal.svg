<svg width="1000" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#120404"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="120" rx="8" fill="url(#tBg)" stroke="#ff1a1a" stroke-opacity="0.4"/>

  <!-- title bar -->
  <rect x="0" y="0" width="1000" height="26" rx="8" fill="#140505"/>
  <circle cx="20" cy="13" r="5" fill="#ff1a1a" opacity="0.8"/>
  <circle cx="40" cy="13" r="5" fill="#5a1a1a" opacity="0.7"/>
  <circle cx="60" cy="13" r="5" fill="#5a1a1a" opacity="0.7"/>
  <text x="500" y="17" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#ff3b3b" letter-spacing="3">
    ROOT@ZERO-REQUIEM:~#
  </text>

  <text x="30" y="55" font-family="Courier New, monospace" font-size="15" fill="#ff2b2b" filter="url(#glow2)">
    &gt; system.boot("GEASS_COMMAND_OS")
  </text>
  <text x="30" y="78" font-family="Courier New, monospace" font-size="14" fill="#c9c9c9">
    &gt; loading modules [python] [django] [fastapi] [docker]... <tspan fill="#ff3b3b">OK</tspan>
  </text>
  <text x="30" y="101" font-family="Courier New, monospace" font-size="14" fill="#c9c9c9">
    &gt; authentication:
    <tspan fill="#ff3b3b"> GRANTED</tspan> — welcome back, Zero.
    <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <rect x="960" y="88" width="10" height="16" fill="#ff1a1a">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
